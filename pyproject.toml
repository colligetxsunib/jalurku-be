[project]
name = "backend"
version = "1.0.0"
description = "Backend JalurKu (nama netral untuk kode, lihat PRD Lampiran A #1)"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.20.0",
    "beautifulsoup4==4.15.0",
    "fastapi==0.143.0",
    "google-genai==2.30.0",
    "httpx==0.28.1",
    "pgvector==0.5.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "pypdf==6.20.1",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "sqlalchemy==2.1.4",
    "uvicorn[standard]==0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "db: tes yang membutuhkan PostgreSQL + pgvector (TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]
