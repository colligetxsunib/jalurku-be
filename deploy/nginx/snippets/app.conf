# Isi server{} bersama untuk mode HTTP dan HTTPS (di-include dari templates/*.conf.template).

# DNS internal Docker. API dicari lewat variabel sehingga nginx tetap start bila api sedang
# dibuat ulang, dan alamat barunya terbaca tanpa reload.
resolver 127.0.0.11 valid=10s ipv6=off;
set $api_upstream http://api:8000;

# Badan JSON profil/analisis/pertanyaan kecil. Hanya /admin/ yang boleh besar (unggah PDF).
client_max_body_size 128k;
client_header_timeout 15s;
client_body_timeout 15s;
send_timeout 30s;
keepalive_timeout 30s;

error_page 403 404 = @tidak_ditemukan;   # 403 = folder statis tanpa index.html
error_page 413 = @terlalu_besar;
error_page 429 = @terlalu_banyak;
error_page 502 503 504 = @api_tidak_tersedia;

location /api/ {
    limit_req zone=ip_api burst=60 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
}

# Kurasi data (X-Admin-Key). Satu-satunya jalur yang boleh menerima badan besar.
location /api/v1/admin/ {
    limit_req zone=ip_admin burst=10 nodelay;
    client_max_body_size 40m;   # aplikasi membatasi PDF 30 MB
    client_body_timeout 60s;
    include /etc/nginx/snippets/proxy-api.conf;
}

# Halaman statis persona fiktif (dibuat scripts/export_persona_static.py). Tanpa data pengguna.
location /demo-statis/ {
    alias /srv/demo-statis/;
    index index.html;
    autoindex off;
    limit_req zone=ip_api burst=60 nodelay;
    add_header Cache-Control "public, max-age=300" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;
    include /etc/nginx/snippets/security-headers.conf;
}

# Selain di atas tidak diteruskan: /docs, /redoc, /openapi.json tidak pernah terekspos lewat nginx.
location / {
    return 404;
}

location @tidak_ditemukan {
    default_type application/json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    return 404 '{"error":{"kode":"tidak_ditemukan","pesan":"Sumber daya tidak ditemukan","detail":{}}}';
}

location @terlalu_besar {
    default_type application/json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    return 413 '{"error":{"kode":"berkas_terlalu_besar","pesan":"Ukuran permintaan melebihi batas","detail":{}}}';
}

location @terlalu_banyak {
    default_type application/json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "5" always;
    return 429 '{"error":{"kode":"terlalu_banyak_permintaan","pesan":"Terlalu banyak permintaan. Coba lagi beberapa saat lagi.","detail":{}}}';
}

location @api_tidak_tersedia {
    default_type application/json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "5" always;
    return 503 '{"error":{"kode":"dependensi_tidak_tersedia","pesan":"Layanan sedang tidak tersedia. Coba lagi sebentar lagi.","detail":{}}}';
}
