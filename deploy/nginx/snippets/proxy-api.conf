# Teruskan ke API (di-include dari location /api/). Backend hanya terjangkau lewat jaringan Docker.
proxy_pass $api_upstream;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;

# MENIMPA, bukan menambah ($proxy_add_x_forwarded_for): nilai kiriman klien dibuang sehingga
# X-Forwarded-For yang dibaca aplikasi (rate limit per IP) tidak bisa dipalsukan. Aplikasi hanya
# mempercayai header ini dari alamat nginx (env TRUSTED_PROXIES).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 45s;   # di atas llm.timeout_detik (20) + embedding, di bawah timeout klien

proxy_hide_header Server;
proxy_hide_header Cache-Control;
add_header Cache-Control "no-store" always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
include /etc/nginx/snippets/security-headers.conf;
