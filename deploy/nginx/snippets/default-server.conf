# Server bawaan port 80 (di-include di tingkat http dari kedua template).
# Menangkap Host tak dikenal (akses lewat IP, pemindai): koneksi diputus tanpa respons.
# Satu-satunya pengecualian: /healthz untuk healthcheck Docker, yang memanggil 127.0.0.1 tanpa Host
# domain sehingga jatuh ke server ini. Tidak menyentuh API, tidak diteruskan ke mana pun.
server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 444;
    }
}
