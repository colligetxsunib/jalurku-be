# Pengaturan tingkat http (di-include dari templates/*.conf.template, yang sendiri berada di conf.d).
server_tokens off;

# Pagar luar terhadap banjir permintaan per IP. Batas per sesi/per IP yang sebenarnya ada di aplikasi
# (config/app.yaml: rate_limit); angka di sini sengaja longgar agar pengguna di balik NAT bersama
# (sekolah, kampus) tidak ikut terblokir.
limit_req_zone $binary_remote_addr zone=ip_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ip_admin:1m rate=30r/m;
limit_req_status 429;
limit_req_log_level warn;

# HSTS hanya dikirim pada koneksi HTTPS (nilai kosong = header tidak ditambahkan).
map $scheme $hsts {
    default "";
    https   "max-age=31536000";
}
